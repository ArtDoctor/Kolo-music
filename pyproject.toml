[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kolo"
version = "0.1.0"
description = "Personalized audio player, latent taste explorer, and preference modeling engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artem Shelamanov" }
]
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "scikit-learn>=1.3.0",
    "umap-learn>=0.5.5",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "librosa>=0.10.1",
    "yt-dlp>=2024.0.0",
    "mutagen>=1.47.0",
    "muq @ git+https://github.com/OpenMuQ/MuQ.git",
    "SpotipyFree>=0.1.0",
    "spotdl>=4.2.0",
    "mlflow>=2.10.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.9.0"
]

[tool.setuptools]
py-modules = ["kolo_rating_model"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

