<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kolo: 3D Latent Space Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #080808;
      color: #f4f4f1;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #header {
      height: 64px;
      padding: 0 24px;
      background: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.085);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      color: #f4f4f1;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .search-box {
      position: relative;
    }
    .search-box input {
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f4f1;
      padding: 7px 14px 7px 32px;
      border-radius: 8px;
      font-size: 13px;
      width: 230px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: #0d8275;
      box-shadow: 0 0 0 2px rgba(13, 130, 117, 0.25);
      width: 270px;
    }
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: #858581;
    }
    .mode-pills {
      display: flex;
      background: #141414;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.085);
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: #858581;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: #0d8275;
      color: #061113;
      font-weight: 700;
    }
    #plot-container {
      width: 100vw;
      height: calc(100vh - 64px);
    }
    #active-view-label {
      font-size: 12px;
      color: #858581;
      margin-left: 8px;
      font-weight: 500;
    }
  </style>
</head>

        text: pts.map(p => `<b>${p.file}</b><br>Genre: ${p.cluster_name}<br>Duration: ${Math.floor(p.duration/60)}m ${Math.round(p.duration%60)}s`),
        hoverinfo: 'text',
        marker: {
          size: sizes,
          color: colors,
          opacity: 0.88,
          line: { width: 0 }
        }
      };

      if (is3D) {
        trace.x = x; trace.y = y; trace.z = z;
      } else {
        trace.x = x; trace.y = y;
      }
      return trace;
    }

    function renderPlot() {
      const is3D = currentMode.endsWith('_3d');
      const traces = [];
      for (let k = 0; k < 6; k++) {
        traces.push(getTraceForCluster(k, currentMode, searchQuery));
      }

      const layout = {
        margin: { l: 0, r: 0, b: 0, t: 0 },
        paper_bgcolor: '#080808',
        plot_bgcolor: '#080808',
        showlegend: true,
        legend: {
          x: 0.02,
          y: 0.98,
          font: { color: '#f4f4f1', size: 11 },
          bgcolor: 'rgba(18, 18, 18, 0.9)',
          bordercolor: 'rgba(255, 255, 255, 0.1)',
          borderwidth: 1
        },
        hoverlabel: {
          bgcolor: '#121212',
          bordercolor: '#0d8275',
          font: { color: '#f4f4f1', size: 12 }
        }
      };

      if (is3D) {
        layout.scene = {
          xaxis: { showgrid: true, gridcolor: 'rgba(255, 255, 255, 0.08)', zerolinecolor: 'rgba(255, 255, 255, 0.15)', tickfont: { color: '#858581' } },
          yaxis: { showgrid: true, gridcolor: 'rgba(255, 255, 255, 0.08)', zerolinecolor: 'rgba(255, 255, 255, 0.15)', tickfont: { color: '#858581' } },
          zaxis: { showgrid: true, gridcolor: 'rgba(255, 255, 255, 0.08)', zerolinecolor: 'rgba(255, 255, 255, 0.15)', tickfont: { color: '#858581' } },
          bgcolor: '#080808'
        };
      } else {
        layout.xaxis = { showgrid: true, gridcolor: 'rgba(255, 255, 255, 0.08)', zerolinecolor: 'rgba(255, 255, 255, 0.15)', tickfont: { color: '#858581' } };
        layout.yaxis = { showgrid: true, gridcolor: 'rgba(255, 255, 255, 0.08)', zerolinecolor: 'rgba(255, 255, 255, 0.15)', tickfont: { color: '#858581' } };
      }

      Plotly.react('plot-container', traces, layout, { responsive: true, displayModeBar: true });
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.mode-btn')).find(b => b.getAttribute('onclick').includes(mode));
      if (activeBtn) activeBtn.classList.add('active');

      const labels = {
        'tsne_3d': '3D t-SNE',
        'umap_3d': '3D UMAP',
        'tsne_2d': '2D t-SNE',
        'umap_2d': '2D UMAP'
      };
      document.getElementById('active-view-label').innerText = labels[mode];
      renderPlot();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderPlot();
    });

    // Initial render
    renderPlot();
  </script>
</body>
</html>
