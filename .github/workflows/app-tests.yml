name: Kolo app tests

on:
  push:
    paths:
      - "kolo.3.app/**"
      - ".github/workflows/app-tests.yml"
  pull_request:
    paths:
      - "kolo.3.app/**"
      - ".github/workflows/app-tests.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kolo.3.app

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kolo.3.app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: kolo.3.app/playwright-report/
          retention-days: 14
